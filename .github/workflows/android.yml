name: Android checks and approved releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: 'Screenshots were approved; publish the nightly'
        type: boolean
        required: true
        default: false
      publish_stable:
        description: 'Screenshots were approved; publish the stable release v<version in gradle.properties>'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Set application version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable }}
          PUBLISH_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_nightly }}
        run: |
          BASE_VERSION=$(sed -n 's/^weatherVersionName=//p' gradle.properties | tr -d '\r')
          # One run-number counter for nightly and stable builds keeps versionCode increasing,
          # so any newer build installs over any older one.
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          if [[ "$PUBLISH_STABLE" == "true" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Stable releases are published only from main"; exit 1; }
            [[ "$PUBLISH_NIGHTLY" != "true" ]] || { echo "Choose either nightly or stable, not both"; exit 1; }
            [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Base version must be plain SemVer"; exit 1; }
            NOTES="release-notes/v${BASE_VERSION}.md"
            test -s "$NOTES" || { echo "Missing release notes: $NOTES"; exit 1; }
            if gh release view "v${BASE_VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release v${BASE_VERSION} already exists; bump weatherVersionName first"; exit 1
            fi
            VERSION_NAME="$BASE_VERSION"
            echo "apk=weathercard-${BASE_VERSION}.apk" >> "$GITHUB_OUTPUT"
          else
            VERSION_NAME="${BASE_VERSION}-nightly.$(TZ=Europe/Istanbul date +%Y%m%d).${GITHUB_RUN_NUMBER}"
            echo "apk=weathercard-nightly.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$SIGNING_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/weathercard-nightly.jks"
      - name: Test, lint and build APK
        env:
          WEATHERCARD_KEYSTORE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('{0}/weathercard-nightly.jks', runner.temp) || '' }}
          WEATHERCARD_SIGNING_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_SIGNING_PASSWORD || '' }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PweatherVersionName="$VERSION_NAME" -PweatherVersionCode="$VERSION_CODE" --stacktrace
      - name: Verify APK signature and prepare download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - name: Update the single nightly release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_nightly == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/nightly-notes.md" <<EOF
          Download **weathercard-nightly.apk** on your Android phone and open it.

          - Version: **$VERSION_NAME** (code: $VERSION_CODE)
          - Android 8.0 or newer
          - Commit: $GITHUB_SHA
          - Signed with the same key as every nightly, so it installs over the previous one.
          - This is a test build, published by hand after its screenshots were reviewed.

          Checks: unit tests, Android lint, release build and APK signature verification.
          EOF
          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload nightly dist/weathercard-nightly.apk dist/weathercard-nightly.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
            gh release edit nightly --title "WeatherCard Nightly" --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly dist/weathercard-nightly.apk dist/weathercard-nightly.apk.sha256 --target "$GITHUB_SHA" --title "WeatherCard Nightly" --notes-file "$RUNNER_TEMP/nightly-notes.md" --prerelease --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish the stable release
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_stable == true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        shell: bash
        run: |
          {
            cat "release-notes/v${VERSION_NAME}.md"
            echo
            echo "---"
            echo
            echo "- Version: **$VERSION_NAME** (code: $VERSION_CODE), Android 8.0 or newer"
            echo "- Commit: $GITHUB_SHA"
            echo "- Checks: unit tests, Android lint, release build and APK signature verification."
          } > "$RUNNER_TEMP/stable-notes.md"
          gh release create "v${VERSION_NAME}" "dist/$APK_NAME" "dist/$APK_NAME.sha256" --target "$GITHUB_SHA" --title "WeatherCard ${VERSION_NAME}" --notes-file "$RUNNER_TEMP/stable-notes.md" --latest --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: weathercard-candidate-${{ steps.version.outputs.name }}
          retention-days: 7
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 7
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/weathercard-nightly.jks"

